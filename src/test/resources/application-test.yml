# 测试环境：H2 内存库，每次启动重建表并灌入 data.sql
spring:
  datasource:
    url: jdbc:h2:mem:smart-campus-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

jwt:
  secret: test-only-secret-key-at-least-32-bytes-long!!
  expiration: 1h

logging:
  level:
    org.hibernate.SQL: warn
