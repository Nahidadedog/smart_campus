server:
  port: 8080

spring:
  application:
    name: smart-campus
  profiles:
    # 默认使用 dev；生产环境通过 --spring.profiles.active=prod 覆盖
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

# 跨域白名单：本地前端开发服务器
app:
  cors:
    allowed-origins: http://localhost:3000

# 生产环境务必通过环境变量 JWT_SECRET 覆盖（至少 32 字节）
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}
  expiration: 24h

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
