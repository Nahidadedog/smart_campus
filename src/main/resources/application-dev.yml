# 本地开发：H2 文件数据库（./data/campus），Flyway 自动建表并灌入演示数据
spring:
  datasource:
    url: jdbc:h2:file:./data/campus;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    # 打印 MyBatis 实际执行的 SQL 与参数
    com.huadi.campus.mapper: debug
